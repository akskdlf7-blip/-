
name: Build Windows EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install PyInstaller
        run: python -m pip install pyinstaller

      - name: Build EXE
        shell: pwsh
        run: |
          $file = Get-ChildItem -File -Filter "*.pyw" | Select-Object -First 1
          if (-not $file) { throw "Python file not found" }
          python -m PyInstaller --onefile --windowed --name ParkingProgram $file.FullName

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: ParkingProgram-Windows
          path: dist/ParkingProgram.exe
